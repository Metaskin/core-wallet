<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover fills notch area on iPhone X+ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />

    <!-- PWA / mobile capability flags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MCT Bank" />
    <meta name="application-name" content="MCT Bank" />

    <!-- Theme colors -->
    <meta name="theme-color" content="#003087" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#003087" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#003087" />

    <!-- SEO / share -->
    <meta name="description" content="Metropolitan Capital &amp; Trust Bank — Premium personal and commercial banking with checking, savings, cards, and wealth management." />
    <meta name="keywords" content="banking, checking, savings, wire transfer, wealth management, FDIC insured" />
    <meta name="author" content="Metropolitan Capital &amp; Trust Bank" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Metropolitan Capital &amp; Trust Bank" />
    <meta property="og:description" content="Premium personal and commercial banking" />
    <meta property="og:image"       content="/icon-512.png" />

    <title>Metropolitan Capital &amp; Trust Bank</title>

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple touch icons (fallback until proper PNGs are generated) -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Splash screens for iOS (uses theme color — full-screen PNGs can be added later) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(() => {/* registered */})
            .catch(() => {/* sw optional — app works without it */});
        });
      }
    </script>
  </body>
</html>
