<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline — MCT Bank</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F9FAFB;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }
    .logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: #003087;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0,48,135,0.25);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #6B7280;
      line-height: 1.6;
      max-width: 300px;
      margin-bottom: 32px;
    }
    .card {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }
    .card p { margin: 0; font-size: 13px; color: #374151; text-align: left; }
    .card strong { color: #003087; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #003087; color: #fff;
      border: none; border-radius: 10px;
      padding: 13px 24px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #002070; }
    .btn:active { transform: scale(0.97); }
    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 24px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      font-size: 11px;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg width="38" height="38" viewBox="0 0 40 40" fill="none">
      <path d="M7 19 L20 9 L33 19" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8"  y="21" width="5" height="12" rx="1" fill="white" opacity="0.7"/>
      <rect x="17" y="17" width="6" height="16" rx="1" fill="white"/>
      <rect x="27" y="19" width="5" height="14" rx="1" fill="white" opacity="0.7"/>
    </svg>
  </div>

  <h1>You're Offline</h1>
  <p>No internet connection. Your account data is safe — reconnect to access your dashboard.</p>

  <div class="card">
    <p><strong>Need help?</strong><br><br>
    Log back in and open a <strong>Support Ticket</strong> from the app, or email us at<br>
    <strong>support@mctbank.online</strong>
    </p>
  </div>

  <button class="btn" onclick="window.location.reload()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
    </svg>
    Try Again
  </button>

  <div class="footer">Metropolitan Capital &amp; Trust Bank · Member FDIC</div>
</body>
</html>
